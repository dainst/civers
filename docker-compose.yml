# Full application: docker compose --profile browsertrix up -d --build --wait
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: civers-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_LOG4J_LOGGERS: "kafka.controller=WARN,kafka.authorizer.logger=WARN,org.apache.zookeeper=WARN"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "./opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - civers-network
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: civers-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: CIVERS Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8088:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - civers-network
    restart: unless-stopped
  web-interface:
    build:
      context: .
      dockerfile: civers_archive_web_interface/Dockerfile
    container_name: civers-web-interface
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - CONFIG_ENVIRONMENT=${CONFIG_ENVIRONMENT:-docker}
      - CONFIG_DIR=/shared-configs/data/web_interface
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - CALLBACK_BASE_URL=http://web-interface:8000
    volumes:
      - ./configs:/shared-configs:ro
      - ./civers_archive_web_interface/static:/app/static
      - ./civers_archive_web_interface/templates:/app/templates
      - web-archives:/app/archives
      - web-data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - civers-network
    restart: unless-stopped
  orchestrator:
    build:
      context: .
      dockerfile: civers_orchestrator/Dockerfile
    container_name: civers-orchestrator
    environment:
      - CONFIG_ENVIRONMENT=${CONFIG_ENVIRONMENT:-docker}
      - CONFIG_DIR=/shared-configs/data/orchestrator
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_CONSUMER_GROUP_ID=civers_orchestrator
      - LOG_LEVEL=INFO
    volumes:
      - ./configs:/shared-configs:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - civers-network
    restart: unless-stopped
  archive-generator:
    build:
      context: .
      dockerfile: civers_archive_generator/Dockerfile
      target: runtime
    ports:
      - "8100:8100"
    container_name: civers-archive-generator
    security_opt:
      - seccomp=./civers_archive_generator/chromium-seccomp.json
    shm_size: '2gb'
    init: true
    environment:
      - REST_HOST=0.0.0.0
      - CONFIG_ENVIRONMENT=${CONFIG_ENVIRONMENT:-docker}
      - CONFIG_DIR=/shared-configs/data/archive_generator
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_CONSUMER_GROUP_ID=civers_archive_generator
      - CIVERS_API_URL=${CIVERS_API_URL:-http://web-interface:8000}
      - LOG_LEVEL=INFO
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - BROWSERTRIX_JOBS_DIR=/jobs
    volumes:
      - ./configs:/shared-configs:ro
      - generator-archives:/app/archives
      - type: bind
        source: ${BROWSERTRIX_JOBS_DIR:-./.browsertrix-jobs}
        target: /jobs
    networks:
      - civers-network
    restart: unless-stopped
    stop_grace_period: 45s
  metadata-extractor:
    build:
      context: .
      dockerfile: civers_metadata_extractor/Dockerfile
    ports:
      - "8101:8101"
    container_name: civers-metadata-extractor
    environment:
      - REST_HOST=0.0.0.0
      - CONFIG_ENVIRONMENT=${CONFIG_ENVIRONMENT:-docker}
      - CONFIG_DIR=/shared-configs/data/metadata_extractor
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_CONSUMER_GROUP_ID=civers_metadata_extractor
      - CIVERS_API_URL=${CIVERS_API_URL:-http://web-interface:8000}
      - LOG_LEVEL=INFO
    volumes:
      - ./configs:/shared-configs:ro
      - metadata-output:/app/output/metadata
    networks:
      - civers-network
    restart: unless-stopped
    stop_grace_period: 45s
  browsertrix:
    image: webrecorder/browsertrix-crawler:1.5.7
    profiles: ["browsertrix"]
    shm_size: '2gb'
    init: true
    command: ["python3", "/worker.py"]
    healthcheck:
      test: ["CMD", "python3", "/worker.py", "--healthcheck"]
      interval: 2s
      timeout: 5s
      start_period: 5s
      retries: 15
    stop_grace_period: 20s
    environment:
      - BROWSERTRIX_JOBS_DIR=/jobs
    volumes:
      - type: bind
        source: ${BROWSERTRIX_JOBS_DIR:-./.browsertrix-jobs}
        target: /jobs
      - ./civers_archive_generator/archive_generators/browsertrix/worker.py:/worker.py:ro
    networks:
      - civers-network
    restart: unless-stopped

networks:
  civers-network:
    name: civers-network
    driver: bridge

volumes:
  kafka-data:
    name: civers-kafka-data
  web-archives:
    name: civers-web-archives
  web-data:
    name: civers-web-data
  generator-archives:
    name: civers-generator-archives
  metadata-output:
    name: civers-metadata-output
  browsertrix-jobs:
    name: civers-browsertrix-jobs
