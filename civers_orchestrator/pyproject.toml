[project]
name = "civers-orchestrator"
version = "1.0.0"
description = "CiVers Orchestrator - Workflow coordination service for web archiving"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.5",
    "pyyaml>=6.0.2",
    "aiokafka>=0.10.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "types-pyyaml>=6.0.12",
    # E2E / integration testing and manual scripts
    # kafka-python provides the synchronous KafkaProducer/KafkaConsumer/KafkaAdminClient
    # used by tests/e2e/, tests/integration/, and scripts/test_workflow.py.
    # The production app uses aiokafka (async); this package is test/tooling only.
    "kafka-python>=2.0.0",
    "aiokafka>=0.12.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["configs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "kafka: marks tests that require Kafka infrastructure",
    "e2e: marks tests as end-to-end tests",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "scripts/*",
    ".venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
# Note: CONFIG_ENVIRONMENT=testing is set via autouse fixture in tests/conftest.py
# This ensures testing.yaml is loaded even if /.dockerenv exists
