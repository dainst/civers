app:
  name: archive_generator
  version: 0.1.0
    # Transport configuration
  transport:
    enabled: ["kafka"]
    kafka:
      bootstrap_servers: localhost:29093
      topics:
        archive_requests: "archive.requests"
        archive_status: "archive.status"
        archive_completed: "archive.completed"
        archive_failed: "archive.failed"
      consumer_group: "archive_generator_group"
      health_check_enabled: true
      monitoring_enabled: true

  
  storage_strategy_class: local_file_storage_strategy.LocalFileStorageStrategy
  archive_directory: tests/archives_artifacts
  singlefile_binary_path: "archive_generators/single-file-x86_64-linux"

domains:
  - name: arachne.dainst.org
    artifacts:
      - warc
      - screenshots
      - txt
      - html
    webpage_types: dynamic

  - name: field.dainst.org
    artifacts:
      - warc
    webpage_types: static
