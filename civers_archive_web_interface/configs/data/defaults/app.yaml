# =============================================================================
# Civers Archive Web Interface - Application Configuration
# =============================================================================
# This file contains all configurable application settings.
# Changes to this file take effect on application restart.

app:
  # Application metadata (shown in API docs and health checks)
  name: "Civers Archive Web Interface"
  version: "1.0.0"
  description: "Civers Archive Web Interface for browsing and replaying archived versions of websites"
  service_name: "civers-archive-web-interface"
  environment: "${CONFIG_ENVIRONMENT:-development}"
  
  # Logging settings
  logging:
    level: "INFO"
    correlation_id_log_level: "INFO"
    file: null
    json_enabled: true
    kafka_log_level: "WARNING"
    access_log_level: "INFO"

# Server settings

# API behavior settings
api:
  # Pagination defaults
  pagination:
    default_page_size: 50
    max_page_size: 100
    default_page: 1
    default_offset: 0
  
  # Kafka settings
  kafka:
    default_priority: 1
  
  callback_base_url: "http://localhost:8000"
  
  # Security settings
  trusted_proxy_hosts:
    - "127.0.0.1"
  
  # Upload limits
  max_upload_size_mb: 100

# Database settings
database:
  connection_timeout_seconds: 10.0

# Directory paths (relative to project root)
directories:
  templates: "templates"
  static: "static"
  archives: "archives"
