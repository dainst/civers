[project]
name = "archive-generator"
version = "0.1.0"
description = "Modular archive generator framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "bs4>=0.0.2",
    "html2text>=2025.4.15",
    "httpx>=0.28.1",
    "justext>=3.0.2",
    "aiokafka>=0.10.0",
    "playwright>=1.52.0",
    "pydantic>=2.11.5",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pyyaml>=6.0.2",
    "trafilatura>=2.0.0",
    "warcat>=2.2.5",
    "warcio>=1.7.5",
    "webdriver-manager>=4.0.2",
    "websockets>=15.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestReturnNotNoneWarning"
]
