# Shared domain configuration — superset for all Civers components
#
# Field guide (each component reads only the fields its model defines):
#   workflow:       Orchestrator — routes request to the correct workflow
#   generators:     Archive Generator — which tools to run and what artifacts to create
#   webpage_types:  Archive Generator — archiving strategy (dynamic / static)
#   input_source:   Metadata Extractor — how to parse the archived document
#   extractor:      Metadata Extractor — which metadata extractor to apply
#   mappings:       Metadata Extractor — source → target field mapping rules

domains:
  - name: arachne.dainst.org
    workflow: archive_generation_only_workflow
    webpage_types: dynamic
    enabled: true
    description: "iDAI.objects/Arachne - Archaeological object database"
    generators:
      - name: scoop
        artifacts: [warc, screenshot, dom-snapshot]
      - name: singlefile
        artifacts: [singlefile]
    input_source: html_document
    extractor: jsonld
    mappings: &arachne_mappings
      "name": "Title.title"
      "description": "Description.description|description_type=Abstract"
      "@id": "AlternateIdentifier.alternate_identifier"
      "author[*].name": "Creator[*].creator_name|name_type=Organizational"
      "author[*].identifier.value": "Creator[*].name_identifiers[NameIdentifier].identifier"
      "author[*].identifier.propertyID": "Creator[*].name_identifiers[NameIdentifier].name_identifier_scheme"
      "publisher[*].name": "Publisher[*].publisher"
      "publisher[*].identifier.value": "Publisher[*].publisher_identifier"
      "publisher[*].identifier.propertyID": "Publisher[*].publisher_identifier_scheme"
      "datePublished": "publication_year|transform=extract_year"
      "dateModified": "Date.date|date_type=Updated"
      "@type": "ResourceType.resource_type_general|constant=Dataset"
      "spatialCoverage[*].name": "GeoLocation.geo_location_place"
      "spatialCoverage[*].geo.latitude": "GeoLocation.geo_location_point.point_latitude"
      "spatialCoverage[*].geo.longitude": "GeoLocation.geo_location_point.point_longitude"
      "temporalCoverage[0].name": "Subject.subject"
      "temporalCoverage[0].identifier.value": "AlternateIdentifier.alternate_identifier"
      "isPartOf.name": "AlternateIdentifier.alternate_identifier"
      "isPartOf.url": "AlternateIdentifier.alternate_identifier"
      "citation[*].name": "Description.description|description_type=Other"
      "citation[*].identifier.value": "AlternateIdentifier.alternate_identifier"
      "image[*]": "AlternateIdentifier.alternate_identifier|alternate_identifier_type=URL"

