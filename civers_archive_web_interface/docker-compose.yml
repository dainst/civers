services:
  # Production service (standalone mode)
  # For full stack with Kafka, use the root docker-compose.yml
  # Note: Archive request submission requires Kafka (use root docker-compose.yml)
  civers-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civers-archive-web
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - JSON_LOGGING=true
      - STORAGE_PATH=/app/archives
    volumes:
      - ./archives:/app/archives:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - civers-network

  # Development service (overrides prod for hot reload)
  civers-web-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civers-archive-web-dev
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=DEBUG
    ports:
      - "8001:8000" # Map container 8000 -> host 8001 to avoid conflicts
    volumes:
      - .:/app # Mount source for live reload
      - ./archives:/app/archives:ro
      - ./logs:/app/logs
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-dir /app/templates --reload-dir /app/static
    profiles:
      - development
    networks:
      - civers-network
  broker:
    image: apache/kafka:latest
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Three listeners: DOCKER (for containers), EXTERNAL (for host), CONTROLLER (for Kafka internals)
      KAFKA_LISTENERS: DOCKER://0.0.0.0:9092,EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT:-29092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-9093}
      # Advertise 'broker:9092' for Docker containers, 'localhost:29092' for external access
      KAFKA_ADVERTISED_LISTENERS: DOCKER://broker:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: DOCKER:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:${KAFKA_CONTROLLER_PORT:-9093}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS:-true}"
    ports:
      # Note: Port 9092 is for Docker containers only (via Docker network)
      # Use 29092 for connections from the host machine
      - "${KAFKA_EXTERNAL_PORT:-29092}:${KAFKA_EXTERNAL_PORT:-29092}"
    healthcheck:
      test: [ "CMD-SHELL", "./opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - civers-network

networks:
  civers-network:
    driver: bridge

volumes:
  civers-logs:
    driver: local
