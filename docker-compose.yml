# ==============================================================================
# CIVERS Full Stack - Docker Compose
# ==============================================================================
#
# This compose file sets up the complete CIVERS stack for integration testing:
# - Kafka broker (message bus)
# - Kafka UI (monitoring)
# - Web Interface (archive storage and viewing)
# - Orchestrator (workflow coordination)
# - Archive Generator (web archiving)
#
# Usage:
#   # Start all services
#   docker compose up -d
#
#   # View logs
#   docker compose logs -f
#
#   # Run integration test
#   python scripts/full_stack_test.py
#
#   # Stop all services
#   docker compose down
#
# ==============================================================================

services:
  # ============================================================================
  # Kafka Broker - Message Bus
  # Note: Using 3.7.0 for compatibility with kafka-python library
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: civers-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_LOG4J_LOGGERS: "kafka.controller=WARN,kafka.authorizer.logger=WARN,org.apache.zookeeper=WARN"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "./opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - civers-network

  # ============================================================================
  # Kafka UI - Monitoring Dashboard (Optional, use --profile ui to start)
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: civers-kafka-ui
    profiles:
      - ui
    environment:
      KAFKA_CLUSTERS_0_NAME: CIVERS Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8088:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - civers-network

  # ============================================================================
  # Web Interface - Archive Storage & Viewing
  # Also publishes archive requests to Kafka for the "Archive from Form" feature
  # ============================================================================
  web-interface:
    build:
      context: .
      dockerfile: civers_archive_web_interface/Dockerfile
    container_name: civers-web-interface
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      # Use shared configs (same pattern as orchestrator)
      - CONFIG_ENVIRONMENT=docker
      - CONFIG_DIR=/shared-configs
      # Override for Docker network
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP_ID=civers_web_interface
      # Callback URL for orchestrator (must use Docker service name)
      - CALLBACK_BASE_URL=http://web-interface:8000
    volumes:
      - ./configs:/shared-configs:ro
      - ./civers_archive_web_interface/static:/app/static
      - web-archives:/app/archives
      - web-data:/app/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - civers-network

  # ============================================================================
  # Orchestrator - Workflow Coordination
  # ============================================================================
  orchestrator:
    build:
      context: .
      dockerfile: civers_orchestrator/Dockerfile
    container_name: civers-orchestrator
    environment:
      - CONFIG_ENVIRONMENT=docker
      - CONFIG_DIR=/shared-configs
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP_ID=civers_orchestrator
      - LOG_LEVEL=INFO
    volumes:
      - ./configs:/shared-configs:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "print('healthy')" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - civers-network
    restart: unless-stopped

  # ============================================================================
  # Archive Generator - Web Archiving
  # NOTE: Uses host network in dev (docker-compose.dev.yml override) so
  # Chromium's out-of-process network service inherits the host network stack,
  # enabling VPN-based URL access. In base/test, uses bridge networking.
  # ============================================================================
  archive-generator:
    build:
      context: .
      dockerfile: civers_archive_generator/Dockerfile
    container_name: civers-archive-generator
    shm_size: '2gb'
    environment:
      - CONFIG_ENVIRONMENT=docker
      - CONFIG_DIR=/shared-configs
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP_ID=civers_archive_generator
      - CIVERS_API_URL=http://web-interface:8000
      - LOG_LEVEL=INFO
      # Force IPv4 DNS resolution for Node.js (Scoop/Portal proxy).
      # Node.js 17+ defaults to verbatim DNS order, which returns IPv6 first on most
      # systems; Docker's IPv6 routing can cause ~8s delays per connection attempt in
      # the Portal intercepting proxy, making Scoop's default 20s loadTimeout fail.
      - NODE_OPTIONS=--dns-result-order=ipv4first
    volumes:
      - ./configs:/shared-configs:ro
      - generator-archives:/app/archives
    networks:
      - civers-network
    depends_on:
      kafka:
        condition: service_healthy
      web-interface:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # Metadata Extractor Service
  # ============================================================================
  # Extracts metadata from archived web pages and publishes to Kafka
  # Note: Uses internal configs, NOT shared configs (different schema for domains)
  # ============================================================================
  metadata-extractor:
    build:
      context: .
      dockerfile: civers_metadata_extractor/Dockerfile
    container_name: civers-metadata-extractor
    environment:
      - CONFIG_ENVIRONMENT=docker
      - CONFIG_DIR=/shared-configs
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP_ID=civers_metadata_extractor
      - CIVERS_API_URL=http://web-interface:8000
      - LOG_LEVEL=INFO
    volumes:
      - ./configs:/shared-configs:ro
      - metadata-output:/app/output/metadata
    networks:
      - civers-network
    depends_on:
      kafka:
        condition: service_healthy
      web-interface:
        condition: service_healthy
    restart: unless-stopped

networks:
  civers-network:
    name: civers-network
    driver: bridge

volumes:
  kafka-data:
    name: civers-kafka-data
  web-archives:
    name: civers-web-archives
  web-data:
    name: civers-web-data
  generator-archives:
    name: civers-generator-archives
  metadata-output:
    name: civers-metadata-output
