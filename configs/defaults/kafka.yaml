transport:
  enabled:
  - kafka
  kafka:
    bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:29092}
    # consumer_group is read directly by archive_generator and metadata_extractor.
    # The orchestrator reads consumer.group_id below instead.
    consumer_group: ${KAFKA_CONSUMER_GROUP_ID}
    component_mappings:
      archive_generator:
        event_models:
          failure: ArchiveFailedEvent
          request: ArchiveRequestEvent
          success: ArchiveCompletedEvent
        request_topic: archive.requests
        response_topics:
          failure: archive.failed
          success: archive.completed
        step_name: archive_generation
      doi_service:
        event_models:
          failure: DOIFailedEvent
          request: DOIRequestEvent
          success: DOICompletedEvent
        request_topic: doi.requests
        response_topics:
          failure: doi.failed
          success: doi.completed
        step_name: doi_assignment
      metadata_extractor:
        event_models:
          failure: MetadataExtractionFailedEvent
          request: MetadataExtractionRequestEvent
          success: MetadataExtractionCompletedEvent
        request_topic: metadata.requests
        response_topics:
          failure: metadata.failed
          success: metadata.completed
        step_name: metadata_extraction
    consumer:
      auto_offset_reset: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      group_id: ${KAFKA_CONSUMER_GROUP_ID}
    producer:
      acks: all
      retries: 3
    topics:
      # Orchestrator topics (read by civers_orchestrator)
      orchestrator_requests: orchestrator.requests
      orchestrator_status: orchestrator.status
      orchestrator_completed: orchestrator.completed
      orchestrator_failed: orchestrator.failed
      # Archive Generator topics (read by civers_archive_generator)
      archive_requests: archive.requests
      archive_status: archive.status
      archive_completed: archive.completed
      archive_failed: archive.failed
      # Metadata Extractor topics (read by civers_metadata_extractor)
      metadata_extraction_requests: metadata.requests
      metadata_extraction_started: metadata.started
      metadata_extracted: metadata.extracted
      metadata_extraction_failed: metadata.failed
      metadata_extraction_completed: metadata.completed
      metadata_validation_completed: metadata.validation.completed
      metadata_status: metadata.status
      metadata_quality: metadata.quality
