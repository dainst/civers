# Transport-Agnostic Workflow Definitions
#
# These workflows define business logic only - NO transport-specific concepts.
# - component: Which service to invoke (not Kafka topics)
# - input_schema: Data contract name (not Kafka event models)
# - output_schemas: Result schemas for success/failure (not Kafka topics)
#
# Transport routing (topics, endpoints, etc.) is configured separately in
# transport-specific files (e.g., kafka.yaml component_mappings).

workflows:
  - name: "standard_archive_workflow"
    description: "Standard web page archiving workflow"
    steps:
      - name: "archive_generation"
        component: "archive_generator"
        input_schema: "ArchiveRequest"
        output_schemas:
          success: "ArchiveCompleted"
          failure: "ArchiveFailed"
        depends_on: []
        timeout_seconds: 300

      - name: "metadata_extraction"
        component: "metadata_extractor"
        input_schema: "MetadataRequest"
        output_schemas:
          success: "MetadataCompleted"
          failure: "MetadataFailed"
        depends_on:
          - "archive_generation"
        timeout_seconds: 60
        input_transformers:
          - source_step: "archive_generation"
            source_field: "snapshot_id"
            target_field: "document_url"
            transformer: "build_web_interface_url"
            required: true
            transformer_config:
              base_url_config_path: "app.metadata.web_interface_url"
              default_base_url: "http://localhost:8000"
              url_template: "{base_url}/api/artifacts/serve?snapshot_id={value}&type=dom-snapshot.html"

      - name: "doi_assignment"
        component: "doi_service"
        input_schema: "DOIRequest"
        output_schemas:
          success: "DOICompleted"
          failure: "DOIFailed"
        depends_on:
          - "metadata_extraction"
        timeout_seconds: 30

