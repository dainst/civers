<!-- Load SingleFile viewer JavaScript -->
<script src="{{ url_for('static', path='js/singlefile_viewer.js') }}"></script>

<!-- SingleFile HTML Archive Viewer Component -->
<div x-data="singleFileViewer('{{ snapshot_id }}')" class="singlefile-viewer w-full h-full">

  <!-- Header with controls -->
  <div class="card-header flex items-center justify-between bg-gray-50 border-b">
    <div class="flex items-center space-x-3">
      <div class="text-2xl">📄</div>
      <span class="text-sm font-medium text-gray-700">SingleFile Archive</span>
      <div x-show="loading" class="flex items-center text-xs text-gray-500">
        <div class="animate-spin rounded-full h-3 w-3 border-b-2 border-gray-900 mr-1"></div>
        <span>Loading...</span>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <!-- Fullscreen Toggle -->
      <button @click="toggleFullscreen()"
              class="btn btn-outline btn-xs hover:bg-gray-100"
              :title="isFullscreen ? 'Exit Fullscreen' : 'Enter Fullscreen'">
        <span x-text="isFullscreen ? '🪟' : '⛶'" class="text-sm"></span>
      </button>

      <!-- Download Button -->
      <button @click="downloadSingleFile()"
              class="btn btn-outline btn-xs hover:bg-gray-100"
              title="Download SingleFile HTML">
        <span class="text-sm">💾</span>
        <span class="hidden sm:inline ml-1">Download</span>
      </button>
    </div>
  </div>

  <!-- SingleFile Iframe Container -->
  <div class="singlefile-container relative bg-white h-96 md:h-[600px]"
       :class="{'fixed inset-0 z-50 bg-white !h-screen': isFullscreen}">

    <!-- Iframe -->
    <iframe :id="'singlefile-frame-' + snapshotId"
            class="w-full h-full border-0 rounded-b-lg"
            :class="{'rounded-none': isFullscreen, 'opacity-0': loading || error}"
            :src="iframeSrc"
            :title="'SingleFile snapshot ' + snapshotId"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
            @load="onIframeLoad"
            @error="onIframeError">
    </iframe>

    <!-- Loading Overlay -->
    <div x-show="loading"
         class="absolute inset-0 flex flex-col items-center justify-center bg-gray-50 rounded-b-lg z-10">
      <div class="flex flex-col items-center space-y-4">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        <div class="text-center">
          <p class="text-sm font-medium text-gray-700">Loading SingleFile content...</p>
        </div>
      </div>
    </div>

    <!-- Error Overlay -->
    <div x-show="error && !loading"
         class="absolute inset-0 flex flex-col items-center justify-center bg-red-50 border border-red-200 rounded-b-lg p-8 z-10">
      <div class="flex flex-col items-center space-y-4 text-center">
        <div class="text-4xl">⚠️</div>
        <div>
          <h3 class="text-sm font-medium text-red-800">Failed to load SingleFile content</h3>
          <p class="text-sm text-red-600 mt-1" x-text="error"></p>
          <button @click="retryLoad()"
                  class="mt-3 btn btn-sm btn-outline text-red-600 border-red-300 hover:bg-red-50">
            🔄 Try Again
          </button>
        </div>
      </div>
    </div>

    <!-- Fullscreen Exit Button -->
    <div x-show="isFullscreen"
         class="absolute top-4 right-4 z-20">
      <button @click="toggleFullscreen()"
              class="btn btn-primary btn-sm shadow-lg"
              title="Exit Fullscreen">
        🪟 Exit Fullscreen
      </button>
    </div>
  </div>
</div>

<style>
/* Minimal required styles */
.singlefile-viewer .animate-spin {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
