# Storage configuration for Civers Archive Web Interface
#
# This file defines the storage backend configuration and caching settings
# for the archive web interface.

storage:
  # Storage backend type
  # Storage provider type: currently supported "filesystem" or "sqlite"
  type: "sqlite"
  
  # Filesystem storage configuration (used by both filesystem and sqlite providers)
  filesystem:
    # Path to the archives directory
    # Can be absolute or relative to project root
    path: "archives"
    
    # Timeout for filesystem operations (seconds)
    # Set to 0 for no timeout
    timeout_seconds: 0
  
  
  

    # SQLite provider configuration (for type: "sqlite")
  sqlite:
      # Path to SQLite database file
      db_path: "data/archives.db"

      # Auto-rebuild index from filesystem if database is empty on startup
      # Set to false if you want to manually control index rebuilding
      auto_rebuild: true

      # Database connection timeout in seconds
      connection_timeout: 10



  # Not supported yet S3 storage configuration (when type: "s3") - Future implementation
  # s3:
  #   bucket: "civers-archives"
  #   region: "us-west-2"
  #   access_key_id: "${AWS_ACCESS_KEY_ID}"
  #   secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  #   prefix: "archives/"
  #   timeout_seconds: 30
  
  # Database storage configuration (when type: "database") - Future implementation  
  # database:
  #   connection_string: "${DATABASE_URL}"
  #   timeout_seconds: 15
  
  # Cache configuration
  cache:
    # Cache TTL in seconds
    # Set to 0 to disable caching
    # Set to -1 for no expiration (cache until manually cleared)
    ttl_seconds: 10000000
    
    # Maximum cache entries (for future use with LRU eviction)
    max_entries: 1000

# Validation configuration
validation:
  # Snapshot ID validation
  snapshot_id_pattern: '^req_[a-zA-Z0-9\-_]+_\d{8}_\d{6}$'
  snapshot_id_max_length: 100
  
  # Directory naming
  snapshot_directory_prefix: 'req_'
  
  # Timestamp parsing formats (in order of preference)
  timestamp_formats:
    - '%Y%m%d_%H%M%S'      # 20240315_143022
    - '%Y-%m-%d_%H-%M-%S'  # 2024-03-15_14-30-22
  
  # File handling limits
  filename_max_length: 255
  
  # Allowed artifact types (security whitelist)
  allowed_artifact_types:
    - archive.wacz
    - metadata.json
    - screenshot.png
    - singlefile.html
    - warc.file
    - document.html
    - dom-snapshot.html
    - archive_generator_metadata.json
  
  # Content-Type mappings for HTTP responses
  content_type_mappings:
    archive.wacz: application/zip
    metadata.json: application/json
    screenshot.png: image/png
    singlefile.html: text/html
    warc.file: application/warc
    document.html: text/html
    dom-snapshot.html: text/html
    archive_generator_metadata.json: application/json

# Environment variable overrides
#
# You can override any configuration value using environment variables
# with the format: CIVERS_<SECTION>_<KEY>
#
# Examples:
#   CIVERS_STORAGE_TYPE=s3
#   CIVERS_FILESYSTEM_PATH=/data/archives  
#   CIVERS_CACHE_TTL_SECONDS=120
#   CIVERS_VALIDATION_SNAPSHOT_ID_MAX_LENGTH=200
#   CIVERS_VALIDATION_SNAPSHOT_DIRECTORY_PREFIX=snap_