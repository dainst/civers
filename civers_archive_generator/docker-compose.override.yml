# Development Override Configuration
# This file is automatically loaded by docker compose (no -f flag needed)
# Contains development-specific environment variables

services:
  broker:
    environment:
      # Development Kafka settings
      KAFKA_EXTERNAL_PORT: 29092
      KAFKA_CONTROLLER_PORT: 9093
      KAFKA_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest # Re-declare image to avoid override issues
    environment:
      KAFKA_UI_CLUSTER_NAME: "Development Kafka Cluster"
      KAFKA_UI_PORT: 8089

  archive-generator:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Application configuration for Docker
      ARCHIVE_ENV: docker
      APP_NAME: archive_generator
      APP_VERSION: 1.0.0

      # Kafka configuration - use Docker service name for inter-container communication
      # Use 'broker:9092' inside Docker (internal port)
      # Use 'localhost:29092' outside Docker (external port)
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      KAFKA_TOPIC_REQUESTS: archive.requests
      KAFKA_TOPIC_STATUS: archive.status
      KAFKA_TOPIC_COMPLETED: archive.completed
      KAFKA_TOPIC_FAILED: archive.failed
      KAFKA_CONSUMER_GROUP: archive_generator_group

      # Storage configuration
      ARCHIVE_DIRECTORY: archives

      # Logging
      UV_LOG_LEVEL: debug

    # Development-specific volume mounts
    volumes:
      - ./archives:/app/archives
