# Production Environment Configuration
# For production deployments

environment: production

app:
  storage:
    enabled:
      - local_file
      - civers_rest_api
    backends:
      local_file:
        base_path: "${METADATA_OUTPUT_DIR:-/data/metadata}"
      civers_rest_api:
        upload_url: "${CIVERS_API_URL}/api/upload"
        timeout_seconds: 60
        retry_attempts: 5
        verify_ssl: true

logging:
  level: "${LOG_LEVEL:-INFO}"

performance:
  max_concurrent_extractions: 20
  request_timeout_seconds: 60
  retry_attempts: 5
  cache_enabled: true
  cache_ttl_seconds: 7200
