[project]
name = "civers-common"
version = "0.1.0"
description = "Shared configuration models and utilities for CiVers microservices"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civers_common"]
