[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --cov=. --cov-report=term-missing --cov-report=html:cov_html --cov-config=.coveragerc --timeout=30
markers =
    unit: Fast unit tests with mocks and no external dependencies
    integration: Integration tests requiring external services like Docker/Kafka
    fast: Ultra-fast tests for rapid development feedback (<15 seconds)
    slow: Tests that take longer to run (>5 seconds)
    docker: Tests requiring Docker containers
    kafka: Tests specifically for Kafka functionality
    playwright: Tests requiring browser automation with Playwright
    browser: Tests requiring browser automation
    e2e: End-to-End tests covering complete workflows
asyncio_mode = auto

# Logging settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning:kafka.*:
    ignore::DeprecationWarning:pkg_resources.*:
