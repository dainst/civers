[project]
name = "civers-metadata-extractor"
version = "2.0.0"
description = "Event-driven metadata extraction service for academic web resources with DataCite format conversion"
authors = [
    {name = "CIVERS Project", email = "info@dainst.org"}
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    # Shared CiVers config models and loaders
    "civers-common",
    # Core dependencies for data validation and models
    "pydantic>=2.11.5",
    # Kafka messaging (async native)
    "aiokafka>=0.10.0",
    # HTML parsing and web content processing
    "beautifulsoup4>=4.13.4",
    "lxml>=5.4.0",
    # Configuration management
    "PyYAML>=6.0.2",
    # Async file I/O (used in storage layer)
    "aiofiles>=24.1.0",
    # HTTP client for content fetching and REST API storage
    "httpx>=0.24.0",
]

[project.scripts]
civers-metadata-extractor = "main:main"
civers-health-check = "scripts.civers_health_check:main"
kafka-monitor = "scripts.kafka_monitor:main"

[project.urls]
Homepage = "https://github.com/dainst/civers-metadata-extractor"
Documentation = "https://github.com/dainst/civers-metadata-extractor/blob/main/README.md"
Repository = "https://github.com/dainst/civers-metadata-extractor"
Issues = "https://github.com/dainst/civers-metadata-extractor/issues"

[tool.uv.sources]
civers-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "metadata_extraction_services",
    "metadata_extractors", 
    "models",
    "configs",
    "transport_services",
    "storage_layer"
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "psutil>=7.0.0",
    "watchfiles>=1.0.0",
    "types-PyYAML>=6.0.12",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running",
]

[tool.coverage.run]
source = [
    "metadata_extraction_services",
    "metadata_extractors",
    "models",
    "configs",
    "transport_services",
    "storage_layer",
]
omit = [
    "tests/*",
    "scripts/*",
    "*/__init__.py",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "ASYNC", # flake8-async (async anti-patterns)
]
ignore = [
    "S101",  # assert usage (fine in tests)
    "B008",  # function calls in default args (common in FastAPI/Pydantic)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
