# Testing Environment Configuration
# For pytest and automated testing

environment: testing

transport:
  kafka:
    consumer_group: "metadata-extractor-test"
    health_check_enabled: false
    monitoring_enabled: false

app:
  storage:
    enabled:
      - local_file
    backends:
      local_file:
        base_path: "tests/output"
        create_subdirectories: true

logging:
  level: "DEBUG"

performance:
  max_concurrent_extractions: 2
  request_timeout_seconds: 10
  cache_enabled: false
