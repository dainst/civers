[project]
name = "archive-generator"
version = "0.1.0"
description = "Configured web page capture and artifact storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "civers-common[kafka,rest]",
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "aiokafka>=0.13.0",
    "playwright>=1.52.0",
    "pydantic>=2.11.5",
    "pyyaml>=6.0.2",
    "warcio>=1.7.5",
    "kafka-python>=2.3.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
]

[tool.uv.sources]
civers-common = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.2.0",
]

# pytest options
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --timeout=30"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Custom Markers
markers = [
    "unit: Fast unit tests with mocks and no external dependencies",
    "integration: Integration tests requiring an external Kafka broker",
]

# Logging settings
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Warning filters
filterwarnings = [
    "ignore::DeprecationWarning:kafka.*:",
    "ignore::DeprecationWarning:pkg_resources.*:"
]
