<!-- WACZ Replay Component using ReplayWeb.page -->
<div class="wacz-replay-container">
    <!-- Controls Bar -->
    <div class="card-header flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <!-- Fullscreen Toggle -->
            <button onclick="toggleWACZFullscreen()" class="btn btn-ghost btn-sm" title="Toggle fullscreen">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 8V4m0 0h4m-4 0l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 1v4m0 0h-4m4 0l-5-5" />
                </svg>
            </button>

            <!-- Archive Info -->
            <div class="text-sm text-gray">
                <span>Web Archive Replay</span>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Archive Status -->
            <div class="badge badge-success">
                <div class="w-2 h-2 bg-current rounded-full mr-1"></div>
                <span>Archive Ready</span>
            </div>
        </div>
    </div>

    <!-- ReplayWeb.page Component -->
    <div class="relative">
        <replay-web-page source="/api/artifacts/serve?snapshot_id={{ snapshot_id }}&type=archive.wacz" {% if
            snapshot.url %}url="{{ snapshot.url }}" {% elif archived_url %}url="{{ archived_url.original_url }}" {%
            endif %} coll="{{ snapshot_id }}" loading="lazy" replayBase="/static/lib/replaywebpage/"
            style="width: 100%; height: 600px; border: 1px solid #e5e7eb; border-top: none; border-radius: 0 0 0.5rem 0.5rem;"
            id="wacz-component-{{ snapshot_id }}">
        </replay-web-page>
    </div>
</div>

<script>
    // Global function for WACZ fullscreen toggle
    function toggleWACZFullscreen() {
        const waczComponent = document.getElementById('wacz-component-{{ snapshot_id }}');
        if (!waczComponent) {
            console.warn('WACZ component not found');
            return;
        }

        try {
            if (!document.fullscreenElement) {
                waczComponent.requestFullscreen().then(() => {
                    console.log('Entered WACZ fullscreen');
                });
            } else {
                document.exitFullscreen().then(() => {
                    console.log('Exited WACZ fullscreen');
                });
            }
        } catch (error) {
            console.error('Fullscreen toggle failed:', error);
            if (typeof showToast === 'function') {
                showToast('Fullscreen not supported');
            }
        }
    }
</script>
