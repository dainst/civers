app:
  storage:
    enabled:
    - local_file
    - civers_rest_api
    backends:
      local_file:
        base_path: ${METADATA_OUTPUT_DIR:-/app/output/metadata}
      civers_rest_api:
        upload_url: ${CIVERS_API_URL:-http://web-interface:8000}/api/upload
        verify_ssl: false
transport:
  transports:
    kafka:
      bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
