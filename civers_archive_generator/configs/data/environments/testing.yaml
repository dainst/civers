# Testing environment configuration
# For integration tests and CI/CD

environment: testing

app:
  # Test-specific archive directory
  archive_directory: ${ARCHIVE_DIRECTORY:-test_archives}

  # Storage configuration for testing
  # Use local file only to avoid external dependencies in tests
  storage:
    enabled:
      - local_file
    backends:
      local_file:
        base_path: ${ARCHIVE_DIRECTORY:-test_archives}
        create_subdirectories: true

# Fast test domains only
domains:
  - name: httpbin.org
    generators:
      - name: scoop
        artifacts: [warc, screenshot, dom-snapshot]
      - name: singlefile
        artifacts: [singlefile]
    webpage_types: dynamic
    
  - name: example.com
    generators:
      - name: scoop
        artifacts: [warc, dom-snapshot]
      - name: singlefile
        artifacts: [singlefile]
    webpage_types: dynamic

  # Integration test domains
  - name: arachne.dainst.org
    generators:
      - name: scoop
        artifacts: [warc, screenshot]
      - name: singlefile
        artifacts: [singlefile]
    webpage_types: dynamic
    
  - name: field.dainst.org
    generators:
      - name: scoop
        artifacts: [warc]
    webpage_types: static
