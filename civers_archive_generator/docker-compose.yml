# Base Docker Compose Configuration
# This file contains the base service definitions.
# Environment-specific settings are in docker-compose.override.yml or other override files.

services:
  broker:
    image: apache/kafka:latest
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Three listeners: DOCKER (for containers), EXTERNAL (for host), CONTROLLER (for Kafka internals)
      KAFKA_LISTENERS: DOCKER://0.0.0.0:9092,EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT:-29092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-9093}
      # Advertise 'broker:9092' for Docker containers, 'localhost:29092' for external access
      KAFKA_ADVERTISED_LISTENERS: DOCKER://broker:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: DOCKER:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:${KAFKA_CONTROLLER_PORT:-9093}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS:-true}"
    ports:
      # Note: Port 9092 is for Docker containers only (via Docker network)
      # Use 29092 for connections from the host machine
      - "${KAFKA_EXTERNAL_PORT:-29092}:${KAFKA_EXTERNAL_PORT:-29092}"
    healthcheck:
      test: [ "CMD-SHELL", "./opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: "${KAFKA_UI_CLUSTER_NAME:-Local Kafka Cluster}"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker:9092"
    ports:
      - "${KAFKA_UI_PORT:-8089}:8080"
    depends_on:
      - broker
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - ui

  archive-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archive-generator
    environment:
      # Environment variables will be set by override files
      CONFIG_ENVIRONMENT: ${CONFIG_ENVIRONMENT:-docker}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_REQUESTS: ${KAFKA_TOPIC_REQUESTS:-archive.requests}
      KAFKA_TOPIC_STATUS: ${KAFKA_TOPIC_STATUS:-archive.status}
      KAFKA_TOPIC_COMPLETED: ${KAFKA_TOPIC_COMPLETED:-archive.completed}
      KAFKA_TOPIC_FAILED: ${KAFKA_TOPIC_FAILED:-archive.failed}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-archive_generator_group}
      ARCHIVE_DIRECTORY: ${ARCHIVE_DIRECTORY:-archives}
      APP_NAME: ${APP_NAME:-archive_generator}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      UV_LOG_LEVEL: ${UV_LOG_LEVEL:-info}
    volumes:
      - ./${ARCHIVE_DIRECTORY:-archives}:/app/archives
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - app
