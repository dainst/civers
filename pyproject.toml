[project]
name = "cviers-project"
version = "0.1.0"
description = "Web capture, metadata extraction and archive storage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.13.0",
    "kafka-python>=2.3.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "deepdiff>=9.0.0",
    "fastapi>=0.136.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.9.0",
    "uvicorn>=0.49.0",
]

[tool.uv.workspace]
members = [
    "civers_common",
    "civers_change_detection",
    "civers_archive_generator",
    "civers_metadata_extractor",
    "civers_orchestrator",
    "civers_archive_web_interface",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
