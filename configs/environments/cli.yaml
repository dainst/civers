# CLI environment configuration
# For running CiVers services via CLI directly on the host (bypassing Kafka)

environment: cli

app:
  environment: cli
  archive_directory: archives
  ssrf_protection_enabled: false
  
  # Transport config - enable 'cli' transport
  transport:
    enabled:
      - cli
    transports:
      cli: {}
  
  # Enable local file storage only for CLI runs
  storage:
    enabled:
      - local_file
    backends:
      local_file:
        base_path: archives
        create_subdirectories: true
