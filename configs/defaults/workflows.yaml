workflows:
- description: Archive generation followed by metadata extraction
  name: archive_and_metadata_workflow
  steps:
  - component: archive_generator
    depends_on: []
    input_schema: ArchiveRequest
    name: archive_generation
    output_schemas:
      failure: ArchiveFailed
      success: ArchiveCompleted
    timeout_seconds: 300
  - component: metadata_extractor
    depends_on:
    - archive_generation
    input_schema: MetadataRequest
    name: metadata_extraction
    output_schemas:
      failure: MetadataFailed
      success: MetadataCompleted
    timeout_seconds: 60
    input_transformers:
    - source_step: archive_generation
      source_field: snapshot_id
      target_field: document_url
      transformer: build_web_interface_url
      required: true
      transformer_config:
        base_url_config_path: app.metadata.web_interface_url
        default_base_url: "http://localhost:8000"
        url_template: "{base_url}/api/artifacts/serve?snapshot_id={value}&type=dom-snapshot.html"
- description: Archive generation only
  name: archive_generation_only_workflow
  steps:
  - component: archive_generator
    depends_on: []
    input_schema: ArchiveRequest
    name: archive_generation
    output_schemas:
      failure: ArchiveFailed
      success: ArchiveCompleted
    timeout_seconds: 300
