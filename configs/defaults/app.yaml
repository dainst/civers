# Shared Application Configuration
# Base settings for all CIVERS components
# Component-specific settings can be extended in each component's own config

app:
  # Common settings for all components
  version: "1.0.0"
  environment: "${CONFIG_ENVIRONMENT:-development}"

  # Archive directory (used by Archive Generator)
  archive_directory: "${ARCHIVE_DIRECTORY:-archives}"
  ssrf_protection_enabled: false # This value must be set to true in production mode

  # Scoop integration settings (Archive Generator)
  # scoop_extra_args: static CLI flags appended to every Scoop invocation.
  # Dynamic flags (--screenshot, --dom-snapshot, --export-attachments-output,
  # -o, -f, URL) are added by scoop_generator.py per request.
  scoop_cli_command: "node lib/scoop/bin/cli.js"
  scoop_timeout_sec: 120
  scoop_extra_args:
    - "--capture-certificates-as-attachment"
    - "false"
    - "--provenance-summary"
    - "false"
    - "--capture-video-as-attachment"
    - "false"
    - "--auto-play-media"
    - "false"
    - "--log-level"
    - "info"
    - "--load-timeout"
    - "60000"
    - "--network-idle-timeout"
    - "10000"
    - "--behaviors-timeout"
    - "10000"
    - "--blocklist" # Dummy value to enable testing of local sites , must be removed in production
    - "http://dummy.org/"
    - "--headless"
    - "${SCOOP_HEADLESS:-true}"
    

  # SingleFile integration settings (Archive Generator)
  singlefile_binary_path: "archive_generators/singlefile/single-file-x86_64-linux"
  singlefile_timeout_sec: 60

  # Transport configuration (included from kafka.yaml, but app section needs reference)
  transport:
    enabled:
      - kafka
    kafka:
      bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-localhost:29092}"
      consumer_group: "${KAFKA_CONSUMER_GROUP_ID:-civers_default}"
      health_check_enabled: true
      monitoring_enabled: true
      topics:
        archive_requests: "archive.requests"
        archive_status: "archive.status"
        archive_completed: "archive.completed"
        archive_failed: "archive.failed"

  # Metadata extraction settings
  metadata:
    web_interface_url: "${WEB_INTERFACE_URL:-http://localhost:8000}"

  # Storage configuration
  storage:
    enabled:
      - local_file
      - civers_rest_api
    backends:
      local_file:
        base_path: "${ARCHIVE_DIRECTORY:-archives}"
        create_subdirectories: true
      civers_rest_api:
        upload_url: "${CIVERS_API_URL:-http://localhost:8000}/api/upload"
        timeout_seconds: 30
        retry_attempts: 3
        verify_ssl: false
        auth:
          enabled: false
